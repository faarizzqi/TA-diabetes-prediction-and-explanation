services:
  diabetes-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diabetes-prediction-app
    ports:
      - "8501:8501"
    volumes:
      # Mount folder model, data, exported, dan app.py agar perubahan langsung aktif
      - ./app.py:/app/app.py
      - ./model:/app/model
      - ./data:/app/data
      - ./exported:/app/exported
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped
